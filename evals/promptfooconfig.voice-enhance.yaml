# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Commerce AI — voice transcript enhancement evals

prompts:
  - "{{transcript}}"

providers:
  - id: file://providers/voice-enhance-provider.ts
    label: openrouter-gpt-56-luna
    config:
      provider: openrouter
      model: openai/gpt-5.6-luna

defaultTest:
  assert:
    - type: javascript
      value: |
        return output.trim().length > 0;

tests:
  - file://tests/voice-enhance.yaml
