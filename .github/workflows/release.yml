name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # npm 11 supports trusted publishing and avoids npm 12's array-wrapped
      # registry responses, which are not yet handled by pnpm registry queries.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm exec changeset publish
          pr-title: Version packages
          commit-message: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_PROVENANCE: true
