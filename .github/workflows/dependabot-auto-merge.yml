name: Dependabot auto-merge

# Runs on `pull_request` (not `pull_request_target`): the workflow file comes from
# the PR's merge commit and never checks out or runs the PR's code.
# Only minor and patch updates are queued for auto-merge; majors stay manual.
# Auto-merge itself waits for the required checks, which come from the
# repository ruleset (this job is not a required check).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'tomasz-miller/commerce-ai-tool'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
